services:
  - type: worker
    name: blitz4-v15-telegram
    runtime: docker
    plan: starter
    autoDeploy: false
    disk:
      name: blitz4-history
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: POLL_SECONDS
        value: "30"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
