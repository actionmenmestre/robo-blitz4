services:
  - type: web
    name: robo-blitz4-teste-gratuito
    runtime: docker
    plan: free
    autoDeploy: false
    envVars:
      - key: DATA_DIR
        value: /tmp/blitz4-data
      - key: POLL_SECONDS
        value: "30"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
